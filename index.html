<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - Multi-Language Voice & Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f19',
                            800: '#131824',
                            700: '#1e2538'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-dark-800 border border-dark-700 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-4 text-center bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">AI Video & Voice Studio</h1>
        
        <!-- Video Generation Style Selection -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2">Select Video Style</label>
            <select id="videoStyle" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                <option value="anime">Only Anime Video</option>
                <option value="human">Only Real Human Video</option>
                <option value="mix">Anime + Human (With Custom Photo Upload)</option>
            </select>
        </div>

        <!-- Image Upload Section -->
        <div id="imageUploadContainer" class="mb-4 hidden">
            <label class="block text-sm font-medium text-gray-400 mb-2">Upload Reference Image (Human or Anime)</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-gray-300 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-white hover:file:bg-cyan-400">
        </div>

        <!-- Prompt Input -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2">Enter your prompt (Dialogue / Action details)</label>
            <input type="text" id="promptInput" placeholder="e.g., Character shouting angrily, fighting scene dialogue" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Voiceover Language Selection -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2">Select Voiceover Language</label>
            <select id="voiceLanguage" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-cyan-500">
                <option value="hi-IN">हिंदी (Hindi)</option>
                <option value="en-US" selected>English (US)</option>
                <option value="ja-JP">日本語 (Japanese)</option>
                <option value="ta-IN">தமிழ் (Tamil)</option>
                <option value="te-IN">తెలుగు (Telugu)</option>
            </select>
        </div>

        <!-- Voiceover Toggle -->
        <div class="mb-5 flex items-center gap-3 bg-dark-900 border border-dark-700 p-3.5 rounded-xl">
            <input type="checkbox" id="voiceoverToggle" checked class="w-5 h-5 accent-cyan-500 rounded cursor-pointer">
            <label for="voiceoverToggle" class="text-sm font-medium text-gray-300 cursor-pointer">Enable AI Voiceover / Dialogue Audio</label>
        </div>

        <!-- Generate Button -->
        <button onclick="generateContent()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg mb-6">
            Generate Video & Voice
        </button>

        <!-- Video Result Section -->
        <div id="resultSection" class="hidden border border-dark-700 bg-dark-900 rounded-xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-medium text-emerald-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span> Generated Successfully
                </span>
                <span id="styleDisplay" class="text-xs bg-dark-700 px-2.5 py-1 rounded-md text-cyan-400"></span>
            </div>

            <video id="videoPlayer" controls class="w-full rounded-lg mb-4 bg-black aspect-video object-cover">
                Your browser does not support the video tag.
            </video>

            <a id="downloadBtn" href="#" download="ai-video.mp4" class="block text-center bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white font-medium py-2.5 rounded-lg transition">
                Download Video
            </a>
        </div>
    </div>

    <script>
        const styleSelect = document.getElementById('videoStyle');
        const imageUploadContainer = document.getElementById('imageUploadContainer');

        styleSelect.addEventListener('change', function() {
            if(this.value === 'mix') {
                imageUploadContainer.classList.remove('hidden');
            } else {
                imageUploadContainer.classList.add('hidden');
            }
        });

        function generateContent() {
            const style = styleSelect.value;
            const prompt = document.getElementById('promptInput').value.trim();
            const imageInput = document.getElementById('imageInput');
            const enableVoice = document.getElementById('voiceoverToggle').checked;
            const selectedLang = document.getElementById('voiceLanguage').value;

            if(!prompt) {
                alert('Please enter a text prompt or dialogue!');
                return;
            }

            if(style === 'mix' && imageInput.files.length === 0) {
                alert('Please upload an image for Anime + Human mix mode!');
                return;
            }

            const resultSection = document.getElementById('resultSection');
            const videoPlayer = document.getElementById('videoPlayer');
            const styleDisplay = document.getElementById('styleDisplay');
            const downloadBtn = document.getElementById('downloadBtn');

            resultSection.classList.remove('hidden');
            
            if(style === 'anime') styleDisplay.innerText = 'Style: Only Anime';
            else if(style === 'human') styleDisplay.innerText = 'Style: Only Human';
            else styleDisplay.innerText = 'Style: Anime + Human Mix';

            // सुरक्षित और पब्लिक वीडियो लिंक
            let sampleVideoUrl = 'https://www.w3schools.com/html/mov_bbb.mp4';
            videoPlayer.src = sampleVideoUrl;
            downloadBtn.href = sampleVideoUrl;
            videoPlayer.load();

            // Multi-Language AI Voiceover Trigger
            if(enableVoice && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(prompt);
                utterance.lang = selectedLang; // चुनी गई भाषा सेट होगी (जैसे hi-IN, ja-JP, आदि)
                utterance.rate = 1.0; 
                utterance.pitch = 0.9; 
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
    </html>
