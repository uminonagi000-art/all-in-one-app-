<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Voiceover & Lip-Sync Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #e2e8f0; font-size: 14px; }
        select, input[type="file"], textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { height: 110px; resize: vertical; }
        button { width: 100%; margin-top: 25px; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        #loading { text-align: center; margin-top: 15px; color: #fbbf24; font-weight: 500; display: none; }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Voiceover & Lip-Sync Studio</h2>
    <p class="subtitle">मूवी, एनिमी या के-ड्रामा पर अपनी पसंद का देसी/विदेशी वॉइसओवर और लिप-सिंक बनाएं!</p>
    
    <form id="voiceoverForm" action="/process" method="POST" enctype="multipart/form-data">
        
        <!-- 1. कैटेगरी सेलेक्शन -->
        <label>1. क्लिप की कैटेगरी चुनें:</label>
        <select name="category">
            <option value="movie">🎬 मूवी क्लिप (Movie Clip)</option>
            <option value="anime">⛩️ एनिमी क्लिप (Anime Clip)</option>
            <option value="kdrama">🇰🇷 कोरियन ड्रामा (K-Drama Clip)</option>
        </select>

        <!-- 2. वीडियो अपलोड (5 मिनट लिमिट) -->
        <label>2. वीडियो अपलोड करें (मैक्सिमम 5 मिनट):</label>
        <input type="file" name="video" id="videoInput" accept="video/*" required>
        <div id="durationError" class="error-msg">माफ कीजिए! वीडियो 5 मिनट से लंबी है। कृपया छोटी क्लिप अपलोड करें।</div>

        <!-- 3. भाषा और टोन -->
        <label>3. वॉइसओवर की भाषा और टोन चुनें:</label>
        <select name="language">
            <option value="bhojpuri">भोजपुरी / बिहारी टोन (Bhojpuri / Bihari)</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="nagpuri">नागपुरी (Nagpuri)</option>
            <option value="en">इंग्लिश (English)</option>
            <option value="zh">चीनी (Chinese)</option>
            <option value="ta">तमिल (Tamil)</option>
            <option value="te">तेलुगु (Telugu)</option>
        </select>

        <!-- 4. डायलॉग इनपुट -->
        <label>4. अपना नया डायलॉग यहाँ लिखें:</label>
        <textarea name="dialogue" placeholder="यहाँ अपना फनी, सीरियस या देसी डायलॉग टाइप करें..." required></textarea>

        <button type="submit" id="submitBtn">वॉइसओवर और लिप-सिंक शुरू करें</button>
        <div id="loading">प्रोसेसिंग हो रही है... वीडियो और ऑडियो मैच किए जा रहे हैं, कृपया प्रतीक्षा करें।</div>
    </form>
</div>

<script>
    const MAX_DURATION = 300; // 300 सेकंड = 5 मिनट

    document.getElementById('voiceoverForm').onsubmit = function(event) {
        const videoInput = document.getElementById('videoInput');
        const file = videoInput.files[0];
        const errorDiv = document.getElementById('durationError');

        if (file) {
            event.preventDefault(); 
            const video = document.createElement('video');
            video.preload = 'metadata';

            video.onloadedmetadata = function() {
                window.URL.revokeObjectURL(video.src);
                if (video.duration > MAX_DURATION) {
                    errorDiv.style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                } else {
                    errorDiv.style.display = 'none';
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('submitBtn').disabled = true;
                    document.getElementById('voiceoverForm').submit();
                }
            }
            video.src = URL.createObjectURL(file);
        }
    };
</script>

</body>
</html>
